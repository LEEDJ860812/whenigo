<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>언제나갈까?</title>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=__NAVER_CLIENT_ID__"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  #status { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #1f2937; color: #fff;
            padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 15px; }
  #status b { font-size: 22px; color: #facc15; }
  #status small { font-size: 13px; opacity: .8; }
  #mapwrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; transition: bottom .3s ease; }
  #map { width: 100%; height: 100%; }   /* 네이버 지도가 컨테이너의 position을 바꿔도 크기가 0이 되지 않도록 래퍼 안에서 100% */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 45%; background: #fff; z-index: 1000;
           border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.2); transform: translateY(100%);
           transition: transform .3s ease; overflow-y: auto; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
  body.open #sheet { transform: none; }
  body.open #mapwrap { bottom: 45%; }
  #sheet h2 { margin: 4px 0 8px; font-size: 17px; }
  .bus { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px;
         border-bottom: 1px solid #eee; cursor: pointer; }
  .bus.sel { background: #fef9c3; }
  .bus .no { font-weight: 700; font-size: 18px; color: #2563eb; }
  .bus .dest { color: #888; font-size: 13px; margin-left: 8px; font-weight: 400; }
  .bus .eta { color: #111; font-weight: 600; }
  .bus .next { color: #888; font-weight: 400; }
  #tools { position: fixed; right: 10px; top: calc(135px + env(safe-area-inset-top, 0px)); z-index: 999;
           display: flex; flex-direction: column; gap: 8px; }
  #tools button { border: 0; border-radius: 20px; padding: 10px 14px; font-size: 14px; background: #fff;
                  box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer; }
  #tools button.on { background: #facc15; font-weight: 700; }
  .me { width: 16px; height: 16px; border-radius: 50%; background: #2563eb; border: 3px solid #fff;
        box-shadow: 0 0 0 3px rgba(37,99,235,.35); }
  .stop { width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 2px solid #2563eb; }
  .busico { background: #fff; border: 2px solid #f97316; border-radius: 14px; padding: 2px 8px; font-size: 13px;
            white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .busico span { margin-left: 4px; font-weight: 700; color: #c2410c; }
  .busico.target { background: #fef08a; border-color: #ea580c; font-size: 15px; }
  .stop.old { border-color: #9ca3af; }
  .busico.far { border-color: #9ca3af; padding: 1px 4px; opacity: .85; }
  #btnRoute { display: none; }
  .swmk { width: 30px; height: 30px; border-radius: 50%; background: #1d4ed8; color: #fff; border: 2px solid #fff;
          box-shadow: 0 2px 6px rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .busmk { position: relative; width: 48px; height: 48px; }
  .buslbl { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: -4px; white-space: nowrap;
            background: #fff; border: 1px solid #9ca3af; border-radius: 10px; padding: 1px 6px; font-size: 12px; font-weight: 700; color: #b91c1c; }
  .buslbl.strong { margin-top: 4px; background: #fef08a; border-color: #ea580c; font-size: 13px; }
  #fatal { display: none; position: fixed; left: 12px; right: 12px; top: 40%; z-index: 2000; background: #fef2f2; color: #991b1b;
           border: 2px solid #ef4444; border-radius: 12px; padding: 16px; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
<div id="status">정류장을 선택하세요</div>
<div id="mapwrap"><div id="map"></div></div>
<div id="fatal"></div>
<div id="tools"><button id="btnFix">📍 위치 보정</button><button id="btnBuf">⏱ 여유 2분</button><button id="btnGps">🎯 GPS로 다시</button><button id="btnRoute">✕ 경로 닫기</button></div>
<div id="sheet"><h2 id="sname"></h2><div id="note" style="color:#888;font-size:13px;min-height:0"></div><div id="list"></div></div>

<script>
const WALK_MS = 1.25;      // 보행속도 m/s (약 4.5km/h)
const DETOUR = 1.3;        // 직선거리 → 실제 도보거리 보정
const DEFAULT = [37.738, 127.034];   // 위치 거부 시 의정부 기본 좌표
let map, me = null, station = null, timer = null, walk = null, walkLine = null, walkToken = 0;

function dist(a, b) {      // haversine (m) * 보정
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b[0] - a[0]), dLng = r(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h)) * DETOUR;
}
const fmt = s => `${Math.floor(s / 60)}분 ${String(Math.floor(s % 60)).padStart(2, "0")}초`;
const ll = (lat, lng) => new naver.maps.LatLng(lat, lng);
// HTML 조각을 지도 위 마커로 올리는 도우미 (가운데 정렬)
const place = (lat, lng, html, z) => new naver.maps.Marker({
  position: ll(lat, lng), zIndex: z || 3, clickable: false,
  icon: { content: `<div style="position:absolute;transform:translate(-50%,-50%)">${html}</div>`, anchor: new naver.maps.Point(0, 0) } });
const resizeMap = () => naver.maps.Event.trigger(map, "resize");   // 하단 목록이 열리고 닫혀 지도 영역이 바뀔 때
const fatal = msg => { const f = document.getElementById("fatal"); f.innerHTML = msg; f.style.display = "block"; };
window.navermap_authFailure = () => fatal(`<b>네이버 지도 인증에 실패했어요</b><br>· 클라이언트 ID가 맞는지<br>· 콘솔의 Web 서비스 URL에 <b>현재 주소</b>(아래 표시)가 등록됐는지 (로컬 테스트는 http://localhost, 127.0.0.1은 안 돼요)<br>· Dynamic Map이 선택됐는지 확인해 주세요.<br>현재 주소: ${location.origin}`);

const SAVE_KEY = "manualPos";
const BUF_OPTS = [0, 1, 2, 3, 5, 10];                      // 여유시간 선택지(분). 버튼을 누를 때마다 순환
let bufferMin = 2;
try { const v = Number(localStorage.getItem("bufferMin")); if (BUF_OPTS.includes(v) && localStorage.getItem("bufferMin") !== null) bufferMin = v; } catch (e) {}
const showBuf = () => { document.getElementById("btnBuf").textContent = `⏱ 여유 ${bufferMin}분`; };
let meOverlay = null, markers = [], fixing = false;
const setStatus = t => { document.getElementById("status").textContent = t; };

function init(lat, lng, isManual, accuracy, load = true) {
  me = [lat, lng];
  map = new naver.maps.Map("map", { center: ll(lat, lng), zoom: 16, zoomControl: false, mapDataControl: false });
  let tilesOk = false;                                   // 타일이 안 오면(= 인증 문제 등) 조용히 흰 화면으로 두지 않고 알려 준다
  naver.maps.Event.addListener(map, "tilesloaded", () => { tilesOk = true; document.getElementById("fatal").style.display = "none"; });
  setTimeout(() => { if (!tilesOk) fatal(`<b>지도 화면이 로드되지 않았어요</b><br>사용 중인 Client ID: <b>${((document.querySelector('script[src*="ncpKeyId"]')||{}).src||'').split('ncpKeyId=')[1]}</b> (콘솔의 Client ID와 같은지 확인)<br>아래 주소에서도 진단할 수 있어요:<br><b>${location.origin}/static/naver_test.html?id=Client_ID</b><br>현재 접속 주소: ${location.origin}<br>지도 영역 크기: ${document.getElementById('map').clientWidth} x ${document.getElementById('map').clientHeight}`); }, 6000);
  meOverlay = place(lat, lng, '<div class="me"></div>', 5);
  meOverlay.setMap(map);
  naver.maps.Event.addListener(map, "click", e => {
    if (fixing) { stopFixing(); setMe(e.coord.lat(), e.coord.lng(), true); return; }           // 보정 모드: 누른 곳이 내 위치
    closeSheet();                                                                              // 아니면 하단 목록 닫기
  });
  document.getElementById("btnFix").onclick = () => fixing ? (stopFixing(), setStatus("정류장을 선택하세요")) : startFixing();
  document.getElementById("btnGps").onclick = useGps;
  document.getElementById("btnBuf").onclick = () => {
    bufferMin = BUF_OPTS[(BUF_OPTS.indexOf(bufferMin) + 1) % BUF_OPTS.length];
    try { localStorage.setItem("bufferMin", String(bufferMin)); } catch (e) {}
    showBuf();                                                 // 카운트다운은 매초 bufferMin을 읽으므로 바로 반영됨
  };
  showBuf();
  document.getElementById("btnRoute").onclick = () => clearRoute();
  markManual(isManual);
  if (!isManual && accuracy > 200) setStatus(`GPS 오차가 커요(약 ${Math.round(accuracy)}m) · 📍 위치 보정으로 직접 지정해 보세요`);
  if (load) loadStations(lat, lng);
}

async function loadStations(lat, lng) {
  markers.forEach(m => m.setMap(null)); markers = [];
  const list = await (await fetch(`/api/stations?lat=${lat}&lng=${lng}`)).json();
  if (!Array.isArray(list)) { setStatus(list.error || "정류장을 불러오지 못했어요"); return; }
  if (!list.length) { setStatus("근처에 정류장이 없어요"); return; }
  list.forEach(s => {
    const mk = new naver.maps.Marker(s.kind === "subway"                                  // 지하철역은 파란 원 🚇, 버스 정류장은 기본 마커
      ? { map, position: ll(s.lat, s.lng), title: s.name, icon: { content: '<div class="swmk">🚇</div>', anchor: new naver.maps.Point(15, 15) } }
      : { map, position: ll(s.lat, s.lng), title: s.name });
    naver.maps.Event.addListener(mk, "click", () => openStation(s));
    mk._sid = s.id;
    markers.push(mk);
  });
}

function markManual(isManual) {
  document.getElementById("btnFix").textContent = isManual ? "📍 보정된 위치" : "📍 위치 보정";
}

function setMe(lat, lng, isManual) {          // 내 위치를 바꾸고 주변 정류장을 다시 불러온다
  me = [lat, lng]; station = null; clearInterval(timer); clearRoute(); clearWalk();
  meOverlay.setPosition(ll(lat, lng));
  map.setCenter(ll(lat, lng));
  closeSheet();
  markManual(isManual);
  try { isManual ? localStorage.setItem(SAVE_KEY, JSON.stringify(me)) : localStorage.removeItem(SAVE_KEY); } catch (e) {}
  setStatus(isManual ? "보정한 위치 기준이에요 · 정류장을 선택하세요" : "정류장을 선택하세요");
  loadStations(lat, lng);
}

function startFixing() {
  fixing = true; clearInterval(timer); closeSheet();
  document.getElementById("btnFix").classList.add("on");
  setStatus("지도에서 내 실제 위치를 눌러 주세요");
}
function stopFixing() { fixing = false; document.getElementById("btnFix").classList.remove("on"); }

function useGps() {
  stopFixing(); setStatus("GPS 위치 확인 중…");
  navigator.geolocation.getCurrentPosition(
    p => { setMe(p.coords.latitude, p.coords.longitude, false);
           if (p.coords.accuracy > 200) setStatus(`GPS 오차가 커요(약 ${Math.round(p.coords.accuracy)}m) · 📍 위치 보정으로 직접 지정해 보세요`); },
    () => setStatus("위치를 가져올 수 없어요 · 브라우저 위치 권한을 확인하거나 📍 위치 보정을 써 주세요"),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ---------- 도보 경로/시간 (TMAP, 실패하면 직선거리 추정)
function estimateWalk() {
  const m = dist(me, [station.lat, station.lng]);
  return { sec: m / WALK_MS, meters: m, path: [me, [station.lat, station.lng]], estimated: true };
}
function drawWalk() {
  if (walkLine) walkLine.setMap(null);
  if (!walk || !walk.path || walk.path.length < 2) return;
  walkLine = new naver.maps.Polyline({ map, path: walk.path.map(p => ll(p[0], p[1])), strokeColor: "#10b981",
                                       strokeWeight: 5, strokeOpacity: 0.95, strokeStyle: walk.estimated ? "shortdash" : "solid", zIndex: 11 });
}
function clearWalk() { walkToken++; if (walkLine) { walkLine.setMap(null); walkLine = null; } walk = null; }
async function loadWalk(s) {
  const t = ++walkToken;
  try {
    const r = await (await fetch(`/api/walk?slat=${me[0]}&slng=${me[1]}&elat=${s.lat}&elng=${s.lng}`)).json();
    if (t !== walkToken || !r.path) return;               // 그 사이 다른 정류장을 눌렀으면 무시
    walk = r; drawWalk();                                 // 카운트다운은 매초 walk를 읽으므로 자동 반영
    if (r.error) document.getElementById("note").textContent = "도보 경로 조회 실패 · 직선거리로 추정했어요";
  } catch (e) { /* 추정값 유지 */ }
}

function closeSheet() {
  document.body.classList.remove("open");
  setTimeout(resizeMap, 320);
}

const minTxt = t => t < 60 ? "곧 도착" : `${Math.round(t / 60)}분`;
const ORD = ["첫 번째", "두 번째"];

async function openStation(s) {
  station = s; clearInterval(timer); clearRoute();
  walk = estimateWalk(); drawWalk(); loadWalk(s);
  document.getElementById("status").textContent = "버스를 선택하세요";
  document.getElementById("sname").textContent = `${s.kind === "subway" ? "🚇" : "🚏"} ${s.name}`;
  const buses = await (await fetch(`/api/arrivals/${encodeURIComponent(s.id)}`)).json();
  const fetchedAt = Date.now();
  if (!Array.isArray(buses)) { document.getElementById("status").textContent = buses.error || "도착정보를 불러오지 못했어요"; return; }
  const box = document.getElementById("list"); box.innerHTML = "";
  if (!buses.length) box.innerHTML = "<p>도착 예정인 버스가 없어요</p>";
  buses.forEach(b => {
    const el = document.createElement("div"); el.className = "bus";
    const next = b.times[1] !== undefined ? `<span class="next"> · ${minTxt(b.times[1])}</span>` : "";
    el.innerHTML = `<span><span class="no" ${b.color ? `style="color:${b.color}"` : ""}>${b.kind === "subway" ? b.route : b.route + "번"}</span>${b.dest ? `<span class="dest">${b.dest}${b.kind === "subway" ? "" : " 방면"}</span>` : ""}</span><span class="eta">${minTxt(b.times[0])}${next}</span>`;
    el.onclick = () => { box.querySelectorAll(".bus").forEach(x => x.classList.remove("sel")); el.classList.add("sel");
                         startCountdown(b, fetchedAt); showRoute(b); };
    box.appendChild(el);
  });
  document.body.classList.add("open");
  setTimeout(() => { resizeMap(); map.panTo(ll(s.lat, s.lng)); }, 320);
}

// ---------- 노선 경로 / 버스 위치 표시
let routeObjs = [], routeToken = 0, targetIdx = 0;
let dimPoly = null, dimLevel = 0, dimRaf = 0;
function setDim(on) {                                   // 지도를 서서히 회색으로 흐리게 / 원래대로
  if (!on && !dimPoly) return;
  if (!dimPoly) dimPoly = new naver.maps.Polygon({
    paths: [[ll(20, 110), ll(20, 150), ll(50, 150), ll(50, 110)]],       // 한반도를 충분히 덮는 큰 사각형
    fillColor: "#4b5563", fillOpacity: 0, strokeOpacity: 0, strokeWeight: 0, clickable: false, zIndex: 1 });
  if (!dimPoly.getMap()) dimPoly.setMap(map);
  const from = dimLevel, to = on ? 0.45 : 0, t0 = performance.now();
  cancelAnimationFrame(dimRaf);
  const step = now => {
    const k = Math.min(1, (now - t0) / 300);
    dimLevel = from + (to - from) * k;
    dimPoly.setOptions({ fillOpacity: dimLevel });
    if (k < 1) dimRaf = requestAnimationFrame(step); else if (!on) dimPoly.setMap(null);
  };
  dimRaf = requestAnimationFrame(step);
}
function clearRoute(keepMarkers) {
  routeToken++;
  routeObjs.forEach(o => o.setMap(null)); routeObjs = [];
  document.getElementById("note").textContent = "";
  if (!keepMarkers) {                                   // 숨겼던 주변 정류장 마커 복원, 지도 흐림 해제
    setDim(false);
    markers.forEach(m => m.setMap(map));
    document.getElementById("btnRoute").style.display = "none";
  }
}
const addObj = o => { o.setMap(map); routeObjs.push(o); return o; };
const poly = (pts, color, w, op) => addObj(new naver.maps.Polyline({
  path: pts.map(p => ll(p[0], p[1])), strokeColor: color, strokeWeight: w, strokeOpacity: op, strokeStyle: "solid", zIndex: 10 }));
const overlay = (lat, lng, html, z) => addObj(place(lat, lng, html, z));
function nearest(line, p) {
  let bi = 0, bd = Infinity;
  line.forEach((q, i) => { const d = (q[0] - p[0]) ** 2 + (q[1] - p[1]) ** 2; if (d < bd) { bd = d; bi = i; } });
  return bi;
}

// 경로선의 점들을 정류장 순서대로 대응시킨다 (점 번호가 계속 커지도록). 맞지 않으면 null
function matchStations(line, st) {
  if (!line || line.length < 2) return null;
  const win = Math.max(20, Math.ceil(line.length / st.length) * 4);    // 정류장 하나당 앞으로 볼 점의 범위
  const idx = []; let prev = 0, bad = 0;
  for (const s of st) {
    let best = prev, bd = Infinity;
    for (let j = prev; j < Math.min(line.length, prev + win); j++) {
      const d = (line[j][0] - s.lat) ** 2 + (line[j][1] - s.lng) ** 2;
      if (d < bd) { bd = d; best = j; }
    }
    if (bd > 3e-6) bad++;                                              // 약 200m 넘게 벗어나면 대응 실패로 센다
    idx.push(best); prev = best;
  }
  return bad > st.length * 0.3 ? null : idx;
}

// 두 지점([위도,경도]) 사이의 진행 방향(북쪽 0°, 시계방향)
function bearing(a, b) {
  const r = x => x * Math.PI / 180, dl = r(b[1] - a[1]);
  const y = Math.sin(dl) * Math.cos(r(b[0]));
  const x = Math.cos(r(a[0])) * Math.sin(r(b[0])) - Math.sin(r(a[0])) * Math.cos(r(b[0])) * Math.cos(dl);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
// 버스 아이콘: 동그란 배지 안에 버스 그림(항상 똑바로) + 배지 바깥의 화살촉이 진행 방향(deg)을 가리킨다
function busHtml(deg, color, scale, label, strong) {
  return `<div class="busmk"><div style="transform:scale(${scale});filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))">` +
    `<svg width="48" height="48" viewBox="0 0 48 48">` +
    `<g transform="rotate(${deg.toFixed(0)} 24 24)"><path d="M24 1 L33 13 L15 13 Z" fill="${color}" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></g>` +
    `<circle cx="24" cy="24" r="15.5" fill="${color}" stroke="#fff" stroke-width="2.5"/>` +
    `<rect x="15.5" y="15.5" width="17" height="15" rx="3" fill="#fff"/>` +
    `<rect x="17.5" y="17.5" width="13" height="6" rx="1.2" fill="${color}"/>` +
    `<rect x="17.5" y="25" width="3" height="2" rx=".8" fill="${color}"/><rect x="27.5" y="25" width="3" height="2" rx=".8" fill="${color}"/>` +
    `<rect x="17" y="30" width="4" height="3" rx="1" fill="#fff"/><rect x="27" y="30" width="4" height="3" rx="1" fill="#fff"/>` +
    `</svg></div>` +
    (label ? `<div class="buslbl${strong ? " strong" : ""}">${label}</div>` : "") + `</div>`;
}

async function showRoute(bus) {
  clearRoute(true);
  const token = routeToken, note = document.getElementById("note");
  if (!bus.route_id) { setDim(false); return; }
  note.textContent = "노선 경로 불러오는 중…";
  let r;
  try { r = await (await fetch(`/api/route/${encodeURIComponent(bus.route_id)}`)).json(); }
  catch (e) { note.textContent = "경로 정보를 불러오지 못했어요"; return; }
  if (token !== routeToken) return;                    // 그 사이 다른 버스를 눌렀으면 무시
  const st = r.stations || [];
  note.textContent = (r.errors && r.errors.length) ? "일부 경로 정보를 불러오지 못했어요" : "";
  if (!st.length) { setDim(false); return; }
  let here = st.findIndex(s => s.seq === Number(bus.sta_order));
  if (here < 0) here = st.findIndex(s => s.id === station.id);
  if (here < 0) { setDim(false); return; }

  const pt = s => [s.lat, s.lng];
  const hereSeq = st[here].seq;

  // 회차점이 있는 노선은 전체(갔다 오는 경로)를 그리지 않고, 내가 타는 방향 구간만 그린다
  const turn = st.findIndex(s => s.turn);
  let lo = 0, hi = st.length - 1;
  if (turn > 0 && turn < st.length - 1) { if (here <= turn) hi = turn; else lo = turn; }
  const loSeq = st[lo].seq, hiSeq = st[hi].seq;
  const inLeg = b => b.seq != null && b.seq >= loSeq && b.seq <= hiSeq;

  // 선택한 버스 = 내 정류장 쪽으로 오는 버스 중 가까운 순서 targetIdx번째 (0: 첫 번째, 1: 두 번째)
  const coming = (r.buses || []).filter(b => inLeg(b) && b.seq <= hereSeq).sort((x, y) => y.seq - x.seq);
  const target = coming[Math.min(targetIdx, coming.length - 1)];
  const bi = target ? Math.max(lo, st.findIndex(s => s.seq === target.seq)) : here;   // 버스 위치(없으면 내 정류장)

  // 구간 경로선: 경로선 점을 정류장 순서대로 대응시켜 [lo, hi] 구간만 자른다. 대응이 안 되면 정류장을 직선으로 연결
  const mapIdx = matchStations(r.line || [], st);
  let leg, ih;
  if (mapIdx) { leg = r.line.slice(mapIdx[lo], mapIdx[hi] + 1); ih = Math.max(0, mapIdx[here] - mapIdx[lo]); }
  else { leg = st.slice(lo, hi + 1).map(pt); ih = here - lo; }
  poly(leg.slice(0, ih + 1), "#374151", 6, 0.9);       // 그 외 경로: 배경보다 진한 회색
  poly(leg.slice(ih), "#2563eb", 7, 0.95);             // 내가 선택한 정류장 → 회차점/종점 (파랑)
  markers.forEach(m => m.setMap(m._sid === station.id ? map : null));   // 내 정류장 마커만 남기고 숨김
  document.getElementById("btnRoute").style.display = "block";
  setDim(true);                                        // 경로가 그려지면 배경 지도를 흐리게

  const legIdx = (s, pos) => (mapIdx && s) ? Math.max(0, mapIdx[st.indexOf(s)] - mapIdx[lo]) : nearest(leg, [pos.lat, pos.lng]);
  (r.buses || []).filter(inLeg).forEach(b => {         // 이 구간을 달리는 버스 (경기: 마지막 정류장 위치, 서울: 실제 좌표)
    const s = st.find(x => x.seq === b.seq);
    const pos = (b.lat != null && b.lng != null) ? { lat: b.lat, lng: b.lng } : s;
    if (!pos) return;
    const k = legIdx(s, pos);                          // 경로선 위 위치 → 앞쪽 점과의 방향이 진행 방향
    const k1 = k + 4 < leg.length ? k : Math.max(0, leg.length - 5), k2 = Math.min(leg.length - 1, k1 + 4);
    const deg = leg.length > 1 ? bearing(leg[k1], leg[k2]) : 0;
    const diff = hereSeq - b.seq, near = diff >= 0 && diff <= 15;     // 내 정류장 전 15정거장 이내면 강조
    const isTarget = target && b.seq === target.seq;
    const label = near ? (diff === 0 ? "정류장" : diff + "정거장 전") : "";
    overlay(pos.lat, pos.lng, isTarget ? busHtml(deg, "#f97316", 1.3, label, true)
                                       : busHtml(deg, near ? "#dc2626" : "#9ca3af", near ? 1 : 0.8, label, false), isTarget ? 7 : near ? 6 : 5);
  });

  const bounds = new naver.maps.LatLngBounds();         // 내 위치 · 내 정류장 · 선택한 버스가 한 화면에 보이게
  bounds.extend(ll(me[0], me[1]));
  bounds.extend(ll(st[here].lat, st[here].lng));
  const bpos = target && target.lat != null ? target : st[bi];
  bounds.extend(ll(bpos.lat, bpos.lng));
  resizeMap();                                         // 목록이 열리면 지도 영역이 이미 줄어 있으므로 아래 여백은 작게
  map.fitBounds(bounds, { top: 150, right: 30, bottom: 30, left: 30 });   // 여백: 위(상태바) 150, 나머지 30
  setTimeout(() => { if (map.getZoom() < 14) { map.setZoom(14); map.setCenter(ll(station.lat, station.lng)); } }, 500);   // 너무 축소되지 않게 제한
}

const clock = ms => new Date(ms).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });

function startCountdown(bus, fetchedAt) {
  clearInterval(timer);
  const tick = () => {
    const now = Date.now();
    const sub = bus.kind === "subway", nm = sub ? bus.route : bus.route + "번", unit = sub ? "열차" : "버스";
    const walkSec = walk.sec, walkMin = Math.ceil(walkSec / 60);
    const info = `도보 ${walkMin}분${walk.estimated ? "(추정)" : ""} + 여유 ${bufferMin}분`;
    // 출발 시각 = 버스 도착 시각 − 도보 시간 − 여유 시간
    const departAt = bus.times.map(t => fetchedAt + t * 1000 - (walkSec + bufferMin * 60) * 1000);
    const i = departAt.findIndex(d => d > now);                // 아직 탈 수 있는 첫 버스
    targetIdx = Math.max(i, 0);
    const st = document.getElementById("status");
    if (i < 0) { st.innerHTML = `${nm} · <small>${info}</small><br>지금 출발해도 놓칠 수 있어요 😢`; return; }
    const arriveAt = fetchedAt + bus.times[i] * 1000;
    const missed = i > 0 ? `${ORD[0]} ${unit}는 놓쳐요 · ` : "";
    st.innerHTML = `${missed}${nm} ${ORD[i]} ${unit} · ${clock(arriveAt)} 도착<br>` +
                   `<b>${fmt((departAt[i] - now) / 1000)}</b> 뒤 · <b>${clock(departAt[i])}</b> 출발<br><small>${info}</small>`;
  };
  tick(); timer = setInterval(tick, 1000);
}

function start() {
  if (typeof naver === "undefined" || !naver.maps) { setStatus("네이버 지도를 불러오지 못했어요 · 클라이언트 ID와 인터넷 연결을 확인해 주세요"); return; }
  const src = (document.querySelector('script[src*="ncpKeyId"]') || {}).src || "";
  if (/ncpKeyId=$/.test(src)) { setStatus("서버에 NAVER_CLIENT_ID 환경변수가 설정되지 않았어요 · 서버 환경변수에 설정 후 다시 시작해 주세요"); return; }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (Array.isArray(saved) && saved.length === 2) { init(saved[0], saved[1], true); return; }   // 이전에 보정한 위치
  init(...DEFAULT, false, 0, false);                                  // 지도를 먼저 띄우고, 위치는 확인되는 대로 반영
  setStatus("내 위치 확인 중… (브라우저의 위치 권한 요청을 허용해 주세요)");
  navigator.geolocation.getCurrentPosition(
    p => { setMe(p.coords.latitude, p.coords.longitude, false);
           if (p.coords.accuracy > 200) setStatus(`GPS 오차가 커요(약 ${Math.round(p.coords.accuracy)}m) · 📍 위치 보정으로 직접 지정해 보세요`); },
    () => { setMe(...DEFAULT, false); setStatus("위치를 가져올 수 없어요 · 기본 위치예요. 📍 위치 보정으로 내 위치를 직접 지정해 보세요"); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}
window.addEventListener("error", e => setStatus("화면 오류: " + e.message));   // 조용히 멈추지 않고 화면에 표시
start();
</script>
