services:
  - type: web
    name: eonje-nagalkka
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # 값은 Render 화면에서 직접 입력 (sync: false = 코드에 값을 저장하지 않음)
      - key: GBIS_KEY
        sync: false
      - key: SEOUL_KEY
        sync: false
      - key: TMAP_KEY
        sync: false
      - key: SEOUL_SUBWAY_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
